# CrediSynch local infrastructure: Postgres (with pgvector) + Keycloak.
# The API, ML service and frontend run on the host for fast iteration.
services:
  db:
    image: pgvector/pgvector:pg16
    container_name: credisynch-db
    environment:
      POSTGRES_DB: credisynch
      POSTGRES_USER: credisynch
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-devpassword}
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credisynch -d credisynch"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: credisynch-keycloak
    command: ["start-dev", "--import-realm", "--http-port=8081"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8081:8081"
    volumes:
      - ./keycloak/realm-credisynch.json:/opt/keycloak/data/import/realm-credisynch.json:ro

volumes:
  db-data:
