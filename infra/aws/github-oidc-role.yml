AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege GitHub Actions OIDC role for the CrediSynch Phase 2 deploy workflow.

Parameters:
  GithubOwner:
    Type: String
  GithubRepository:
    Type: String
  GithubOwnerId:
    Type: String
    Description: Numeric GitHub user/org ID - repos created after GitHub's immutable-subject
      rollout put this in the OIDC sub claim instead of (or alongside) the owner name.
  GithubRepositoryId:
    Type: String
    Description: Numeric GitHub repository ID - same reason as GithubOwnerId.
  BackendRepositoryArn:
    Type: String
  MlRepositoryArn:
    Type: String
  FrontendRepositoryArn:
    Type: String
  InstanceId:
    Type: String

Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GithubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'CrediSynchGithubDeploy-${GithubRepository}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                # workflow_dispatch runs (deploy-aws.yml's primary trigger) carry the dispatched
                # ref - main - in `sub`; the release tag push is the secondary trigger. Repos
                # created after GitHub's immutable-subject rollout (this one: 2026-09-20) use
                # repo:owner@ownerId/repo@repoId:... instead of repo:owner/repo:... - list both
                # forms since which one a given token actually uses isn't otherwise observable
                # without a live run.
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GithubOwner}/${GithubRepository}:ref:refs/heads/main'
                  - !Sub 'repo:${GithubOwner}/${GithubRepository}:ref:refs/tags/v1.0-submission'
                  - !Sub 'repo:${GithubOwner}@${GithubOwnerId}/${GithubRepository}@${GithubRepositoryId}:ref:refs/heads/main'
                  - !Sub 'repo:${GithubOwner}@${GithubOwnerId}/${GithubRepository}@${GithubRepositoryId}:ref:refs/tags/v1.0-submission'
      Policies:
        - PolicyName: phase2-image-publish-and-restart
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Ref BackendRepositoryArn
                  - !Ref MlRepositoryArn
                  - !Ref FrontendRepositoryArn
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'
              - Effect: Allow
                Action: ssm:SendCommand
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'
              - Effect: Allow
                # GetCommandInvocation has no document/instance-scoped resource type in SSM's
                # IAM action reference - AWS only supports Resource: * for it, unlike SendCommand.
                Action: ssm:GetCommandInvocation
                Resource: '*'

Outputs:
  RoleArn:
    Value: !GetAtt GithubDeployRole.Arn
