AWSTemplateFormatVersion: '2010-09-09'
Description: Least-privilege GitHub Actions OIDC role for the CrediSynch Phase 2 deploy workflow.

Parameters:
  GithubOwner:
    Type: String
  GithubRepository:
    Type: String
  BackendRepositoryArn:
    Type: String
  MlRepositoryArn:
    Type: String
  InstanceId:
    Type: String

Resources:
  GithubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1

  GithubDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub 'CrediSynchGithubDeploy-${GithubRepository}'
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GithubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GithubOwner}/${GithubRepository}:ref:refs/tags/v0.2-decision-core'
      Policies:
        - PolicyName: phase2-image-publish-and-restart
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource:
                  - !Ref BackendRepositoryArn
                  - !Ref MlRepositoryArn
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: '*'
              - Effect: Allow
                Action:
                  - ssm:SendCommand
                  - ssm:GetCommandInvocation
                Resource:
                  - !Sub 'arn:${AWS::Partition}:ssm:${AWS::Region}::document/AWS-RunShellScript'
                  - !Sub 'arn:${AWS::Partition}:ec2:${AWS::Region}:${AWS::AccountId}:instance/${InstanceId}'

Outputs:
  RoleArn:
    Value: !GetAtt GithubDeployRole.Arn
