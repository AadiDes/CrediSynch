spring:
  application:
    name: credisynch-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/credisynch}
    username: ${DB_USER:credisynch}
    password: ${DB_PASSWORD:devpassword}
  flyway:
    enabled: true
    locations: classpath:db/migration
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/credisynch}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: credisynch-api

app:
  hashing:
    # Dev-only default. In AWS this comes from Secrets Manager; it is never a literal in code.
    entity-key: ${ENTITY_HASH_KEY:dev-only-entity-hmac-key-change-me}
  policy:
    version: policy-1.0.0
    loss-given-fraud: 1500.0     # expected loss when fraud is approved
    step-up-cost: 3.0            # friction cost of an OTP/passkey challenge for a good customer
    step-up-catch-rate: 0.8      # share of fraudsters stopped by the challenge
    restricted-cost: 5.0         # friction cost of a locked, low-limit approval
    exposure-fraction: 0.1       # share of the loss still exposed under restrictions
    decline-cost: 150.0          # cost of wrongly declining a good customer
  graph:
    link-window-hours: 720       # 30 days: how far back a shared device/phone/email/address/account counts
    step-up-linked-threshold: 1  # 1+ other application sharing an identity floors the decision at STEP_UP
    review-linked-threshold: 3   # 3+ sharing applications looks like a ring: floor at REVIEW
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
  ml:
    base-url: ${ML_BASE_URL:http://localhost:8000}
    timeout-ms: 400

logging:
  level:
    root: INFO
    com.credisynch: DEBUG
