openapi: 3.1.0
info:
  title: CrediSynch Decision API
  version: 1.0.0
  description: >
    Real-time fraud decisioning for digital lending. This contract is written before the
    implementation: the Spring Boot service and the React console are both built against it.
    Every decision is synchronous; explanation and case briefs are produced asynchronously.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Identity
  - name: Decisioning
  - name: Cases
  - name: Transactions
  - name: Platform
security:
  - bearerAuth: []

paths:
  /api/v1/me:
    get:
      tags: [Identity]
      summary: Identity, roles and authentication level of the caller
      responses:
        '200':
          description: Caller identity
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/v1/applications:
    post:
      tags: [Decisioning]
      summary: Submit a credit application and receive a decision synchronously
      description: >
        Target latency p95 under 250 ms. Requires an Idempotency-Key: a retried submission
        returns the original decision instead of creating a second application.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApplicationRequest' }
      responses:
        '200':
          description: Decision (also returned for a replayed idempotency key)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Idempotency key reused with a different payload
        '429':
          description: Rate limit exceeded

  /api/v1/applications/{applicationId}/decision:
    get:
      tags: [Decisioning]
      summary: Retrieve the decision recorded for an application
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Decision
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DecisionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/queue/summary:
    get:
      tags: [Cases]
      summary: Analyst case queue summary
      responses:
        '200':
          description: Queue summary
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cases:
    get:
      tags: [Cases]
      summary: List fraud cases (ANALYST)
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [OPEN, IN_REVIEW, CLOSED] }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Page of cases
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasePage' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/cases/{caseId}:
    get:
      tags: [Cases]
      summary: Case detail with reason codes, linked entities and the generated brief (ANALYST)
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Case detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CaseDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /api/v1/cases/{caseId}/labels:
    post:
      tags: [Cases]
      summary: Record an analyst label; this is the fast feedback signal for retraining (ANALYST)
      parameters:
        - name: caseId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LabelRequest' }
      responses:
        '201': { description: Label recorded }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/transactions:
    post:
      tags: [Transactions]
      summary: Authorise a purchase on an issued card (module A - merchant-locked cards)
      description: >
        Applies the lock, velocity cap and risk checks attached to a restricted approval.
        Messy merchant descriptors are resolved to the locked partner by vector similarity.
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionRequest' }
      responses:
        '200':
          description: Authorisation outcome
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TransactionResponse' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/confirmations/{confirmationId}:
    post:
      tags: [Transactions]
      summary: Customer answers "was this you?"; the answer becomes a label within minutes
      parameters:
        - name: confirmationId
          in: path
          required: true
          schema: { type: string, format: uuid }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, enum: [YES_IT_WAS_ME, NOT_ME] }
      responses:
        '200': { description: Answer recorded }
        '403': { $ref: '#/components/responses/Forbidden' }

  /api/v1/platform/status:
    get:
      tags: [Platform]
      summary: Platform status (ADMIN)
      responses:
        '200': { description: Status }
        '403': { $ref: '#/components/responses/Forbidden' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Validation failed
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Missing or invalid token
    Forbidden:
      description: Authenticated but not permitted
    NotFound:
      description: Not found
  schemas:
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: array
          items: { type: string }
    Me:
      type: object
      required: [username, roles]
      properties:
        username: { type: string }
        roles:
          type: array
          items: { type: string, enum: [APPLICANT, ANALYST, ADMIN] }
        authLevel: { type: string, description: 'acr claim: 1 = password, 2 = stepped up' }
        issuer: { type: string }
    ApplicationRequest:
      type: object
      required: [externalRef, channel, applicant, device, features]
      properties:
        externalRef: { type: string, maxLength: 64 }
        channel: { type: string, enum: [WEB, MOBILE, POS_PARTNER] }
        partnerId: { type: string, maxLength: 64 }
        applicant: { $ref: '#/components/schemas/Applicant' }
        device: { $ref: '#/components/schemas/DeviceContext' }
        features:
          type: object
          additionalProperties: { type: [number, string, 'null'] }
          description: Model features (BAF schema)
        freeText:
          type: string
          maxLength: 500
          description: >
            Untrusted applicant text. Never interpreted as instructions by the AI layer;
            an injection attempt here is treated as a fraud signal.
    Applicant:
      type: object
      required: [fullName, email, phone]
      properties:
        fullName: { type: string, maxLength: 128 }
        email: { type: string, format: email }
        phone: { type: string, maxLength: 20 }
        addressLine: { type: string, maxLength: 200 }
        bankAccountRef: { type: string, maxLength: 64 }
    DeviceContext:
      type: object
      required: [deviceFingerprint]
      properties:
        deviceFingerprint: { type: string, maxLength: 128 }
        ipAddress: { type: string, maxLength: 45 }
        sessionLengthMinutes: { type: number }
        keepAliveSession: { type: boolean }
    DecisionResponse:
      type: object
      required: [applicationId, decisionId, action, decidedAt]
      properties:
        applicationId: { type: string, format: uuid }
        decisionId: { type: string, format: uuid }
        action: { type: string, enum: [APPROVE, STEP_UP, APPROVE_RESTRICTED, REVIEW, DECLINE] }
        customerMessage:
          type: string
          description: Non-exploitable message for the applicant; never exposes model internals.
        fraudProbability: { type: number, format: double }
        graphRisk: { type: number, format: double }
        noveltyScore: { type: number, format: double }
        reasonCodes:
          type: array
          items: { $ref: '#/components/schemas/ReasonCode' }
        restrictions: { $ref: '#/components/schemas/Restrictions' }
        modelVersion: { type: string }
        policyVersion: { type: string }
        degradedMode: { type: boolean }
        latencyMs: { type: integer }
        decidedAt: { type: string, format: date-time }
    ReasonCode:
      type: object
      properties:
        code: { type: string }
        feature: { type: string }
        contribution: { type: number }
        direction: { type: string, enum: [INCREASES_RISK, DECREASES_RISK] }
    Restrictions:
      type: object
      description: Present when the action is APPROVE_RESTRICTED.
      properties:
        lockedPartnerId: { type: string }
        creditLimitMinor: { type: integer, format: int64 }
        velocityCapPerDay: { type: integer }
        liftAt: { type: string, format: date-time }
    CasePage:
      type: object
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/CaseSummary' }
        nextCursor: { type: string, nullable: true }
    CaseSummary:
      type: object
      properties:
        caseId: { type: string, format: uuid }
        applicationId: { type: string, format: uuid }
        status: { type: string, enum: [OPEN, IN_REVIEW, CLOSED] }
        priority: { type: integer }
        action: { type: string }
        fraudProbability: { type: number }
        ringId: { type: string, format: uuid, nullable: true }
        openedAt: { type: string, format: date-time }
    CaseDetail:
      allOf:
        - $ref: '#/components/schemas/CaseSummary'
        - type: object
          properties:
            reasonCodes:
              type: array
              items: { $ref: '#/components/schemas/ReasonCode' }
            linkedApplications:
              type: array
              items: { type: string, format: uuid }
            ring: { $ref: '#/components/schemas/Ring' }
            brief: { type: string, description: LLM-written analyst brief, grounded on reason codes and graph evidence }
            briefModel: { type: string }
            similarCases:
              type: array
              items: { $ref: '#/components/schemas/CaseSummary' }
    Ring:
      type: object
      properties:
        ringId: { type: string, format: uuid }
        algorithm: { type: string, enum: [CONNECTED_COMPONENTS, LOUVAIN, K_CLIQUE] }
        size: { type: integer }
        density: { type: number }
        sharedEntities:
          type: array
          items:
            type: object
            properties:
              entityType: { type: string, enum: [DEVICE, PHONE, EMAIL, ADDRESS, BANK_ACCOUNT, IP] }
              applicationCount: { type: integer }
    LabelRequest:
      type: object
      required: [label]
      properties:
        label: { type: string, enum: [FRAUD, LEGITIMATE, UNCERTAIN] }
        note: { type: string, maxLength: 500 }
    TransactionRequest:
      type: object
      required: [cardAccountId, amountMinor, rawDescriptor]
      properties:
        cardAccountId: { type: string, format: uuid }
        amountMinor: { type: integer, format: int64 }
        rawDescriptor: { type: string, maxLength: 256 }
    TransactionResponse:
      type: object
      properties:
        transactionId: { type: string, format: uuid }
        outcome: { type: string, enum: [APPROVED, DECLINED_LOCK, DECLINED_VELOCITY, DECLINED_RISK, CONFIRM_PENDING] }
        matchedPartnerId: { type: string, nullable: true }
        matchScore: { type: number }
        matchMethod: { type: string, enum: [EXACT, VECTOR, TRIGRAM, NONE] }
        confirmationId: { type: string, format: uuid, nullable: true }
        reason: { type: string }
