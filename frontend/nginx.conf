server {
    listen 8082;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA: every unmatched path falls back to index.html, so client-side navigation
    # (Keycloak redirect back to the app, a refresh mid-session) never 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
